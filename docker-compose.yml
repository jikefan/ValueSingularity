# 本地关系库。行情/财报事实表不进 PG，见 docs/data-architecture.md。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vs
      POSTGRES_PASSWORD: vs
      POSTGRES_DB: vs
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=8MB
      -c max_connections=30
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vs -d vs']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
