[project]
name = "vs-api"
version = "0.1.0"
description = "ValueSingularity API — A 股价值分析服务"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "duckdb>=2.0.1",
  "pyarrow>=26.0.1",
  "akshare>=1.20.65",
  "tenacity>=9.2.1",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文注释与文案里的全角标点是有意为之，不做同形字检查
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["akshare", "akshare.*", "pyarrow", "pyarrow.*", "pandas", "pandas.*"]
ignore_missing_imports = true
